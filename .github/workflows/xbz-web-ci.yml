name: XBZ Web CI

# Sur toutes les branches + toutes les PR, pour attraper une régression (typage,
# lint, build) AVANT le déploiement Vercel — y compris sur les branches de feature.
on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Lint
      run: npm run lint
    - name: Typecheck
      run: npx tsc --noEmit
    - name: Build
      run: npm run build
    - name: Tests
      run: npm test --if-present
